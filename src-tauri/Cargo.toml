[package]
name = "jsongridder"
version = "0.1.0"
description = "JSON を表形式で見て直せるローカルツール"
authors = ["VTRiot"]
license = "MIT"
edition = "2024"

[lib]
name = "jsongridder_lib"
crate-type = ["rlib"]

[[bin]]
name = "jsongridder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
encoding_rs = "=0.8.44"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_IO", "Win32_System_Ioctl"] }
